[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awesome-guard"
version = "0.1.0"
description = "Self-updating awesome-list engine: live GitHub stats, rendered README tables and machine-readable JSON."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "claude-plugins-radar maintainers" }]
keywords = ["awesome-list", "github", "claude-code", "automation", "markdown", "catalog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
awesome-guard = "awesome_guard.cli:main"

[project.urls]
Homepage = "https://github.com/iliasaberkane6-lab/claude-plugins-radar"
Repository = "https://github.com/iliasaberkane6-lab/claude-plugins-radar"

[tool.setuptools.packages.find]
where = ["src"]
