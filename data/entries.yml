list:
  title: "Claude Plugins Radar"
  description: "The live, hand-curated, machine-readable directory of Claude Code plugins, skills and agents."

categories:
  - id: frameworks
    title: "Frameworks & Methodology"
    subtitle: "Change how Claude Code thinks, plans and works — not just what it can access."
    entries:
      - name: "Superpowers"
        repo: "obra/superpowers"
        description: "TDD-first skills framework: planning, brainstorming, structured debugging, skill authoring."
        install: "plugin: obra/superpowers-marketplace"
        tags: [workflow, tdd, skills]
      - name: "gstack"
        repo: "garrytan/gstack"
        description: "Garry Tan's virtual engineering team: 23 slash-command skills for plan, review, design, QA, security, ship."
        install: "gstacks.org/install.sh"
        tags: [team, workflow, planning]
      - name: "Compound Engineering"
        repo: "EveryInc/compound-engineering-plugin"
        description: "Spawns 50+ sub-agents so Claude gets smarter about your codebase over time."
        install: "plugin: EveryInc/compound-engineering-plugin"
        tags: [agents, knowledge]
      - name: "planning-with-files"
        repo: "OthmanAdi/planning-with-files"
        description: "Persistent file-based planning for long-running agent tasks that survives crashes and context resets."
        install: "clone: OthmanAdi/planning-with-files"
        tags: [planning, files]
      - name: "ponytail"
        repo: "DietrichGebert/ponytail"
        description: "Makes your agent think like the laziest senior dev in the room: short, decisive output."
        install: "DietricGebert/ponytail"
        tags: [style, productivity]
      - name: "harness"
        repo: "revfactory/harness"
        description: "Meta-skill that designs domain-specific agent teams and generates the skills they use."
        install: "revfactory/harness"
        tags: [agents, meta]
      - name: "autoharness"
        repo: "tigerless-labs/autoharness"
        description: "Self-learning skill layer for Claude Code that distills skills from your own sessions."
        install: "tigerless-labs/autoharness"
        tags: [skills, learning]
      - name: "claude-code-best-practice"
        repo: "shanraisshan/claude-code-best-practice"
        description: "From vibe coding to agentic engineering: battle-tested practices that make Claude better."
        install: "shanraisshan/claude-code-best-practice"
        tags: [practice, guide]
      - name: "pro-workflow"
        repo: "rohitg00/pro-workflow"
        description: "Self-correcting memory workflow: Claude learns from your corrections, compounding over time."
        install: "rohitg00/pro-workflow"
        tags: [memory, workflow]

  - id: plugins
    title: "Plugins & Marketplaces"
    subtitle: "Ready-made plugin packs and marketplaces you can install in one command."
    entries:
      - name: "agents"
        repo: "wshobson/agents"
        description: "Multi-harness agentic plugin marketplace for Claude Code, Codex CLI, Cursor and more."
        install: "plugin: wshobson/agents"
        tags: [marketplace, agents]
      - name: "pm-skills"
        repo: "phuryn/pm-skills"
        description: "PM skills marketplace: 100+ agentic skills, commands and plugins for the whole product lifecycle."
        install: "plugin: phuryn/pm-skills"
        tags: [pm, marketplace]
      - name: "claude-skills"
        repo: "alirezarezvani/claude-skills"
        description: "345 Claude Code skills, agents and plugins: 30+ agents, 70+ custom commands."
        install: "plugin: alirezarezvani/claude-skills"
        tags: [skills, marketplace]
      - name: "claude-code-plugins-plus-skills"
        repo: "jeremylongshore/claude-code-plugins-plus-skills"
        description: "471 plugins, 3,069 skills and 347 agents. Open-source marketplace with the ccpi CLI package manager."
        install: "ccpi"
        tags: [marketplace, package-manager]
      - name: "claude-night-market"
        repo: "athola/claude-night-market"
        description: "23 Claude Code plugins: TDD enforcement hooks, git/PR workflows, spec-driven development."
        install: "plugin: athola/claude-night-market"
        tags: [pack, hooks]
      - name: "ultraship"
        repo: "Houseofmvps/ultraship"
        description: "39 skills, 33 tools and 11 agents for ship-ready workflows."
        install: "plugin: Houseofmvps/ultraship"
        tags: [pack, shipping]
      - name: "claude-plugins"
        repo: "2389-research/claude-plugins"
        description: "28 plugins and MCP servers: TDD, multi-agent orchestration and iteration workflows."
        install: "plugin: 2389-research/claude-plugins"
        tags: [pack, mcp]
      - name: "claude-code-settings"
        repo: "feiskyer/claude-code-settings"
        description: "Curated skills, sub-agents and config templates that supercharge Claude Code."
        install: "feiskyer/claude-code-settings"
        tags: [config]
      - name: "claude-codex-settings"
        repo: "fcakyon/claude-codex-settings"
        description: "Battle-tested Claude Code, Codex and Cursor configs, plugins, hooks and agents."
        install: "fcakyon/claude-codex-settings"
        tags: [config, cross-tool]
      - name: "ui-ux-pro-max"
        repo: "nextlevelbuilder/ui-ux-pro-max-skill"
        description: "Design-intelligence plugin that layers opinionated UI/UX guidance on top of Claude's output."
        install: "plugin: nextlevelbuilder/ui-ux-pro-max-skill"
        tags: [design, uiux]

  - id: memory
    title: "Memory & Context"
    subtitle: "Give Claude Code memory across sessions and keep context windows lean."
    entries:
      - name: "claude-mem"
        repo: "thedotmack/claude-mem"
        description: "Persistent context across sessions for every agent: captures everything your agent learns."
        install: "npm: claude-mem"
        tags: [memory]
      - name: "context-mode"
        repo: "mksglu/context-mode"
        description: "Context-window optimization: sandboxes tool output (98% reduction), persists session memory."
        install: "mksglu/context-mode"
        tags: [context, optimization]
      - name: "memsearch"
        repo: "zilliztech/memsearch"
        description: "Persistent, unified memory layer for all your AI agents — Claude Code, Codex and more."
        install: "zilliztech/memsearch"
        tags: [memory, rag]
      - name: "Citadel"
        repo: "SethGammon/Citadel"
        description: "Operating layer for Claude Code and Codex: persistent project memory and state."
        install: "SethGammon/Citadel"
        tags: [memory, state]
      - name: "Continuous-Claude-v3"
        repo: "parcadei/Continuous-Claude-v3"
        description: "Context management via hooks: state kept in ledgers with clean handoffs between sessions."
        install: "parcadei/Continuous-Claude-v3"
        tags: [hooks, state]
      - name: "mex"
        repo: "mex-memory/mex"
        description: "Persistent project memory for AI coding agents: structured scaffold plus drift detection."
        install: "mex-memory/mex"
        tags: [memory]
      - name: "sidstack"
        repo: "junixlabs/sidstack"
        description: "Persistent project memory exposed through 32 MCP tools for knowledge and impact."
        install: "junixlabs/sidstack"
        tags: [memory, mcp]
      - name: "arscontexta"
        repo: "agenticnotetaking/arscontexta"
        description: "Claude Code plugin that generates individualized knowledge systems from your conversations."
        install: "plugin: agenticnotetaking/arscontexta"
        tags: [knowledge]

  - id: skills
    title: "Skills & Libraries"
    subtitle: "Curated skill libraries for engineering, research, design, security and business work."
    entries:
      - name: "skills"
        repo: "mattpocock/skills"
        description: "Production engineering skills: debugging, testing, architecture and code review workflows."
        install: "mattpocock/skills"
        tags: [engineering]
      - name: "agentic-awesome-skills"
        repo: "sickn33/agentic-awesome-skills"
        description: "AAS Core: the local, agent-first control plane for complete catalog discovery."
        install: "sickn33/agentic-awesome-skills"
        tags: [catalog, control-plane]
      - name: "awesome-agent-skills"
        repo: "VoltAgent/awesome-agent-skills"
        description: "1,000+ agent skills from official dev teams and the community, for any agent."
        install: "VoltAgent/awesome-agent-skills"
        tags: [catalog]
      - name: "skills"
        repo: "wondelai/skills"
        description: "Wondel.ai agent skills: business, marketing, UX and coding frameworks."
        install: "wondelai/skills"
        tags: [business, marketing]
      - name: "Deep-Research-skills"
        repo: "Weizhena/Deep-Research-skills"
        description: "Structured deep-research skill for Claude Code, Codex and others with human-in-the-loop checkpoints."
        install: "Weizhena/Deep-Research-skills"
        tags: [research]
      - name: "ctf-skills"
        repo: "ljagiello/ctf-skills"
        description: "Agent skills for solving CTF challenges: web exploitation, binary pwn and crypto."
        install: "ljagiello/ctf-skills"
        tags: [security, ctf]
      - name: "i-have-adhd"
        repo: "ayghri/i-have-adhd"
        description: "A skill that stops your coding agent from burying the answer: ADHD-friendly output."
        install: "ayghri/i-have-adhd"
        tags: [style]
      - name: "skills"
        repo: "browser-act/skills"
        description: "Browser automation CLI built for AI agents: breaks through anti-bot walls."
        install: "browser-act/skills"
        tags: [browser, automation]
      - name: "video-shotcraft"
        repo: "Vincentwei1021/video-shotcraft"
        description: "AI video skill for Claude Code and Codex: cinematic product videos with Remotion."
        install: "Vincentwei1021/video-shotcraft"
        tags: [video]
      - name: "Generative-Media-Skills"
        repo: "SamurAIGPT/Generative-Media-Skills"
        description: "Multi-modal generative media skills for Claude Code, Cursor and Gemini CLI."
        install: "SamurAIGPT/Generative-Media-Skills"
        tags: [media, image]
      - name: "gpt-image2-ppt-skills"
        repo: "JuneYaooo/gpt-image2-ppt-skills"
        description: "Clone any .pptx into your own deck: gpt-image-2 mimics the layout, you keep the story."
        install: "JuneYaooo/gpt-image2-ppt-skills"
        tags: [office, slides]
      - name: "auteur"
        repo: "agiwhitelist/auteur"
        description: "The Claude Code skill that directs a website like a film: commit-sheet, scenes, cut."
        install: "agiwhitelist/auteur"
        tags: [web, design]
      - name: "engram"
        repo: "nagisanzenin/engram"
        description: "Evidence-based learning engine: first-principles curricula with frequent review."
        install: "nagisanzenin/engram"
        tags: [learning]
      - name: "claude-smart"
        repo: "ReflexioAI/claude-smart"
        description: "Turns your corrections into preferences, project-specific skills and shared skills."
        install: "ReflexioAI/claude-smart"
        tags: [learning, memory]
      - name: "vibe-coding-prompt-template"
        repo: "KhazP/vibe-coding-prompt-template"
        description: "Templates and workflow for generating PRDs, tech designs and MVPs."
        install: "KhazP/vibe-coding-prompt-template"
        tags: [planning, templates]
      - name: "Claude-Code-Everything-You-Need-to-Know"
        repo: "wesammustafa/Claude-Code-Everything-You-Need-to-Know"
        description: "A practical Claude Code guide with clear mental models and copy-paste examples."
        install: "wesammustafa/Claude-Code-Everything-You-Need-to-Know"
        tags: [guide]
      - name: "Auto-claude-code-research-in-sleep"
        repo: "wanshuiyin/Auto-claude-code-research-in-sleep"
        description: "ARIS: lightweight markdown-only skills for autonomous research while you sleep."
        install: "wanshuiyin/Auto-claude-code-research-in-sleep"
        tags: [research, automation]
      - name: "claude-code-guide"
        repo: "zebbern/claude-code-guide"
        description: "Setup, commands, workflows, agents, skills and tips-n-tricks for Claude Code."
        install: "zebbern/claude-code-guide"
        tags: [guide]
      - name: "claude-code-my-workflow"
        repo: "pedrohcgs/claude-code-my-workflow"
        description: "Ready-to-fork Claude Code template for academics: LaTeX/Beamer plus R."
        install: "pedrohcgs/claude-code-my-workflow"
        tags: [academic, templates]

  - id: agents
    title: "Agents & Orchestration"
    subtitle: "The agents themselves, multi-agent orchestration and agent team management."
    entries:
      - name: "claude-code"
        repo: "anthropics/claude-code"
        description: "Anthropic's official terminal-based coding agent. The platform everything else plugs into."
        install: "npm: @anthropic-ai/claude-code"
        tags: [official]
        official: true
      - name: "ai-maestro"
        repo: "23blocks-OS/ai-maestro"
        description: "AI agent orchestrator with skills system: manage Claude, Codex or any agent from one dashboard."
        install: "23blocks-OS/ai-maestro"
        tags: [orchestration]
      - name: "hivemind"
        repo: "activeloopai/hivemind"
        description: "Turns your traces into reusable skills across agents."
        install: "activeloopai/hivemind"
        tags: [traces, skills]
      - name: "claude-octopus"
        repo: "nyldn/claude-octopus"
        description: "Surface AI blindspots: up to 8 AI models on every research and code task before you ship."
        install: "nyldn/claude-octopus"
        tags: [multi-model, review]
      - name: "NotFair"
        repo: "nowork-studio/NotFair"
        description: "Goal-driven, loop-powered marketing agents that pursue your business goals 24/7."
        install: "nowork-studio/NotFair"
        tags: [marketing]
      - name: "OpenMythos"
        repo: "kyegomez/OpenMythos"
        description: "Theoretical reconstruction of the Claude Mythos architecture, built from first principles."
        install: "kyegomez/OpenMythos"
        tags: [mythos, research]
      - name: "babysitter"
        repo: "a5c-ai/babysitter"
        description: "Enforces obedience on agentic workforces and helps them manage execution."
        install: "a5c-ai/babysitter"
        tags: [guardrail, agents]
      - name: "claude-code-agent-teams-exercises"
        repo: "panaversity/claude-code-agent-teams-exercises"
        description: "30 practical exercises for agent teams: creation, coordination, quality hooks, parallel review."
        install: "panaversity/claude-code-agent-teams-exercises"
        tags: [learning, teams]

  - id: quality
    title: "Safety, Quality & Review"
    subtitle: "Guardrails, code review and verification layers for agentic engineering."
    entries:
      - name: "cc-safety-net"
        repo: "kenryu42/cc-safety-net"
        description: "AI coding agent guardrail: a CLI hook that blocks destructive git and filesystem actions."
        install: "kenryu42/cc-safety-net"
        tags: [safety, hooks]
      - name: "brooks-lint"
        repo: "hyhmrright/brooks-lint"
        description: "AI code reviews grounded in 12 classic engineering books, with decay-risk diagnostics."
        install: "hyhmrright/brooks-lint"
        tags: [review]
      - name: "claude-video-vision"
        repo: "jordanrendric/claude-video-vision"
        description: "Give Claude the ability to watch and understand videos: Claude Code plugin with vision tools."
        install: "jordanrendric/claude-video-vision"
        tags: [video]
      - name: "getspecstory"
        repo: "specstoryai/getspecstory"
        description: "Local-first extensions for AI IDEs and terminal agents: specs, history and insights."
        install: "specstoryai/getspecstory"
        tags: [specs, insights]
      - name: "pg-aiguide"
        repo: "timescale/pg-aiguide"
        description: "MCP server and Claude plugin for Postgres skills and documentation: better SQL from AI."
        install: "timescale/pg-aiguide"
        tags: [database, mcp]
      - name: "agent-rules-books"
        repo: "ciembor/agent-rules-books"
        description: "AGENTS.md rules and skills for AI coding agents — Codex, Cursor and Claude Code."
        install: "ciembor/agent-rules-books"
        tags: [rules]

  - id: catalogs
    title: "Directories & Catalogs"
    subtitle: "Where the rest of the ecosystem lives: marketplaces, mega-lists and searchable catalogs."
    entries:
      - name: "claude-plugins-official"
        repo: "anthropics/claude-plugins-official"
        description: "Anthropic's official marketplace: 200+ curated first-party and partner plugins."
        install: "auto-registered"
        tags: [official, marketplace]
        official: true
      - name: "claude-plugins-community"
        repo: "anthropics/claude-plugins-community"
        description: "Anthropic's reviewed community marketplace, installed with the @claude-community suffix."
        install: "@claude-community"
        tags: [official, marketplace]
        official: true
      - name: "skills"
        repo: "anthropics/skills"
        description: "Anthropic's official skills library, showing how skills are designed and used internally."
        install: "anthropics/skills"
        tags: [official, skills]
        official: true
      - name: "claude-code-templates"
        repo: "davila7/claude-code-templates"
        description: "Open-source catalog and CLI behind aitmpl.com: thousands of agents, commands, skills and MCP servers."
        install: "aitmpl.com"
        tags: [catalog, cli]
      - name: "awesome-claude-code"
        repo: "hesreallyhim/awesome-claude-code"
        description: "The big curated collection of Claude Code patterns, hooks and commands."
        install: "hesreallyhim/awesome-claude-code"
        tags: [catalog]
      - name: "awesome-claude-skills"
        repo: "ComposioHQ/awesome-claude-skills"
        description: "1,000+ skills and SaaS integrations in one install."
        install: "ComposioHQ/awesome-claude-skills"
        tags: [catalog]
      - name: "awesome-claude-plugins"
        repo: "composio-community/awesome-claude-plugins"
        description: "Curated list of production-ready plugins that extend Claude Code."
        install: "composio-community/awesome-claude-plugins"
        tags: [catalog]
      - name: "awesome-claude-plugins-metrics"
        repo: "quemsah/awesome-claude-plugins"
        description: "Automated collection of Claude Code plugin adoption metrics across GitHub repositories."
        install: "quemsah/awesome-claude-plugins"
        tags: [catalog, metrics]
      - name: "awesome-mcp-servers"
        repo: "punkpeye/awesome-mcp-servers"
        description: "The de-facto catalog of MCP servers, for Claude Code, Cursor and any MCP client."
        install: "punkpeye/awesome-mcp-servers"
        tags: [catalog, mcp]
      - name: "servers"
        repo: "modelcontextprotocol/servers"
        description: "Official reference MCP servers from the Model Context Protocol team."
        install: "modelcontextprotocol/servers"
        tags: [official, mcp]
        official: true
